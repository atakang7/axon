name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Align latest release tag with main history
        run: |
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)"
          [ -n "$latest_tag" ] || exit 0

          latest_version="${latest_tag#v}"
          release_commit="$(git log --format='%H' --grep="^chore(release): ${latest_version} " -n1)"
          [ -n "$release_commit" ] || exit 0

          git tag -f "$latest_tag" "$release_commit"

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
